# Source manifest for skill-finder. The publishing pipeline
# (scripts/sign_skill.py + scripts/upload_skill.py) populates the
# gs_uri, zip_sha256, signature, and signing_key_id fields at
# publish time. Do not commit those values back to the source
# tree.
author: apigee-devrel
capabilities: []
description: Discovers and installs agentic skills from the customer
  API hub. Two modes - SEARCH AND INSTALL one matching skill by
  natural-language query, verifying its ed25519 signature against
  the trust root(s) installed under keys/; LIST every available
  skill in the catalog as a markdown table, with cursor pagination,
  so the user can browse what's offered before installing.
keywords:
  - skill
  - finder
  - catalog
  - discovery
  - install
  - apihub
license: Apache-2.0
manifest_schema_version: '1'
name: skill-finder
runtime_iam: []
version: 0.1.0
